# Persistent host wiring and Linux namespace topology for two factory-default
# G1 robots. Both robots keep 192.168.123.164 because each physical interface
# is moved into a different network namespace.
version: 1
robot_ip: "192.168.123.164"

robot_a:
  interface: "enp10s0"
  expected_mac: "bc:fc:e7:b8:96:49"
  namespace: "g1a"
  robot_address: "192.168.123.201/24"
  bridge_config: "../../../g1_sim2real/config/bridge_omnicontact_a.yaml"
  veth:
    host_name: "veth-g1a"
    host_address: "10.201.1.1/24"
    namespace_name: "veth-g1a-ns"
    namespace_address: "10.201.1.2/24"

robot_b:
  interface: "enp11s0"
  expected_mac: "60:cf:84:8a:8f:95"
  namespace: "g1b"
  robot_address: "192.168.123.201/24"
  bridge_config: "../../../g1_sim2real/config/bridge_omnicontact_b.yaml"
  veth:
    host_name: "veth-g1b"
    host_address: "10.201.2.1/24"
    namespace_name: "veth-g1b-ns"
    namespace_address: "10.201.2.2/24"
