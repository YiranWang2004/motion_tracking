# Wired onboard inference: copy this file AND dual_network.yaml to both robots.
# Host endpoints/namespaces come from the existing dual_network.yaml topology.
policy_config: dual_scalebfm_contact_v2_box_lateral.yaml
artifact_directory: dual_policy_artifacts_box1m_lateral_20260908
vive_config: omnicontact_vive_dual.json
cpu_affinity: []
acceleration:
  backend: tensorrt
  directory: tensorrt_lateral
  python: /usr/bin/python3
  torch_num_threads: 1
network:
  transport: wired_namespace
  wired_topology: dual_network.yaml
  max_clock_rtt_s: 0.01
  a:
    robot_interface: enP8p1s0
    # host defaults to dual_network.yaml robot_ip; override only for a different onboard IP.
    host_pose_port: 55300
    pose_port: 55310
    team_port: 55320
    bridge_udp:
      state_bind_host: 127.0.0.1
      state_port: 55001
      cmd_host: 127.0.0.1
      cmd_port: 55002
  b:
    robot_interface: eth0
    host_pose_port: 55301
    pose_port: 55310
    team_port: 55320
    bridge_udp:
      state_bind_host: 127.0.0.1
      state_port: 55001
      cmd_host: 127.0.0.1
      cmd_port: 55002
runtime:
  startup_timeout_s: 30.0
  local_state_timeout_s: 0.06
  pose_timeout_s: 0.10
  peer_timeout_s: 0.12
  start_delay_s: 0.75
  max_frame_skew: 2
  max_processing_s: 0.018
  max_slow_ticks: 3
  max_command_gap_s: 0.10
